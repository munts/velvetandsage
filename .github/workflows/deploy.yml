name: Deploy to Flywheel
on:
    push:
      branches:
        - main
jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: '8.1'
            tools: composer
        - name: Install Node dependencies
          run: npm ci
        - name: Install Composer dependencies
          run: composer install --no-dev --optimize-autoloader
        - name: Build assets
          run: npm run build
        - name: Deploy to Flywheel via SFTP
          uses: SamKirkland/FTP-Deploy-Action@v4.3.4
          with:
            server: ${{ secrets.FLYWHEEL_SFTP_HOST }}
            username: ${{ secrets.FLYWHEEL_SFTP_USER }}
            password: ${{ secrets.FLYWHEEL_SFTP_PASSWORD }}
            protocol: sftp
            port: 22
            local-dir: ./
            server-dir: /org-purple-squirrel/velvet-sage/wp-content/themes/velvetandsage/
