name: Deploy to Flywheel
on:
    push:
      branches:
        - main
jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: '8.1'
            tools: composer
        - name: Install Node dependencies
          run: npm ci
        - name: Cache vendor directory
          id: vendor-cache
          uses: actions/cache@v4
          with:
            path: vendor
            key: vendor-${{ hashFiles('composer.lock') }}
        - name: Install Composer dependencies
          run: composer install --optimize-autoloader
        - name: Build assets
          run: npm run build
        - name: Install production Composer dependencies
          run: composer install --no-dev --optimize-autoloader
        - name: Prepare deployment directory
          run: |
            mkdir -p deploy
            VENDOR_EXCLUDE=""
            if [ "${{ steps.vendor-cache.outputs.cache-hit }}" == "true" ]; then
              VENDOR_EXCLUDE="--exclude='vendor'"
            fi
            rsync -av --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='assets/scripts' --exclude='assets/styles' --exclude='package.json' --exclude='package-lock.json' --exclude='composer.json' --exclude='composer.lock' --exclude='*.md' --exclude='.gitignore' --exclude='.editorconfig' --exclude='tests' --exclude='Tests' --exclude='test' --exclude='docs' --exclude='Docs' --exclude='.vscode' --exclude='deploy' $VENDOR_EXCLUDE ./ deploy/
        - name: Deploy to Flywheel via SFTP
          uses: wlixcc/SFTP-Deploy-Action@v1.2.4
          with:
            server: ${{ secrets.FLYWHEEL_SFTP_HOST }}
            username: ${{ secrets.FLYWHEEL_SFTP_USER }}
            password: ${{ secrets.FLYWHEEL_SFTP_PASSWORD }}
            port: 22
            local_path: ./deploy/*
            remote_path: /org-purple-squirrel/velvet-sage/wp-content/themes/velvetandsage/
            sftp_only: true
